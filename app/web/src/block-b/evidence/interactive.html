<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--ink:var(--foreground);--muted:var(--muted-foreground);--surface:var(--card);--sunken:var(--secondary);--line:var(--border);--line-strong:var(--border);--accent:var(--chart-1);--sand:var(--chart-2);--font:var(--font-sans);--mono:var(--font-mono);--r:var(--radius);--r-s:var(--radius)}*{box-sizing:border-box}html,body{margin:0}h2,h3{margin:0}button{font:inherit} .btn{ display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-s); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink); white-space: nowrap; }
.btn:hover{ background: var(--sunken); }
.btn.primary{ background: var(--graphite); border-color: var(--graphite); color: #fff; }
.btn.ghost{ border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover{ background: var(--sunken); color: var(--ink); }
.btn.sm{ height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn svg{ width: 15px; height: 15px; }
.card, .panel{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
th, td{ text-align: left; padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--line); }
th .arr{ color: var(--accent); margin-left: 3px; }
td.n, th.n{ text-align: right; }
tbody tr:hover td{ background: #fafbfc; }
.block-b { min-width: 0; color: var(--ink); }
.bb-compat { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.block-b h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.block-b h3 { font-size: 15px; font-weight: 600; }
.block-b h4 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
.block-b p { max-width: 80ch; }
.block-b .bb-scope, .block-b .bb-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; line-height: 1.5; }
.block-b .bb-scope { max-width: 90ch; }
.block-b .bb-section { margin-top: 20px; }
.block-b .bb-section > header { margin-bottom: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.block-b .bb-section > header p { grid-column: 1 / -1; }
.block-b .bb-subhead { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.block-b .bb-subhead h4 { margin-bottom: 0; }
.block-b button:disabled { opacity: .55; cursor: default; }
.block-b .bb-section > header p { margin-bottom: 0; }
.block-b .bb-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.block-b .bb-body { padding: 14px 16px; }
.block-b .bb-body, .block-b .bb-variant { min-width: 0; }
.block-b .bb-body > :last-child { margin-bottom: 0; }
.block-b .bb-variant + .bb-variant { margin-top: 16px; }
.block-b .bb-empty { padding: 16px 0; color: var(--muted); font-size: 13px; margin: 0; }
.block-b .bb-table { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: var(--r-s); }
.block-b .bb-table:focus-visible, .block-b button:focus-visible, .block-b summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.block-b table { font-variant-numeric: tabular-nums; }
.block-b th { white-space: normal; min-width: 92px; vertical-align: bottom; }
.block-b th:first-child { min-width: 105px; }
.block-b td { vertical-align: top; }
.block-b .bb-denom { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.block-b .bb-unknown { color: var(--muted); font-size: 12px; }
.block-b .bb-code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.block-b .bb-product { display: block; margin: 0 0 8px; }
.block-b details { margin-top: 12px; }
.block-b summary { cursor: pointer; color: var(--accent); font-size: 13px; width: fit-content; max-width: 100%; }
.block-b details[open] > summary { margin-bottom: 12px; }
.block-b .bb-chart { display: block; width: 100%; height: auto; overflow: visible; }
.block-b .bb-chart text { font-family: var(--font); fill: var(--muted); font-size: 12px; }
.block-b .bb-chart .bb-grid { stroke: var(--line); }
.block-b .bb-chart .bb-point, .block-b .bb-chart .bb-line { stroke: var(--accent); }
.block-b .bb-chart .bb-point { fill: var(--accent); }
.block-b .bb-chart .bb-alt { stroke: var(--sand); }
.block-b .bb-chart .bb-point.bb-alt { fill: var(--sand); }
.block-b .bb-chart .bb-line { fill: none; stroke-width: 2; }
.block-b .bb-chart .bb-timestamp { stroke-dasharray: 5 4; }
.block-b .bb-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.block-b .bb-legend span { display: inline-flex; align-items: center; gap: 6px; }
.block-b .bb-swatch { width: 18px; border-top: 2px solid var(--accent); display: inline-block; }
.block-b .bb-swatch.bb-alt { border-color: var(--sand); }
.block-b .bb-swatch.bb-timestamp { border-top-style: dashed; }
.block-b .bb-share { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.block-b .bb-track { display: inline-block; height: 6px; width: 80px; background: var(--sunken); border-radius: 3px; overflow: hidden; flex: none; }
.block-b .bb-track > i { display: block; height: 100%; background: var(--accent); }
.block-b .bb-error { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-s); margin-top: 12px; }
.block-b .bb-error p { margin: 0 0 10px; }
.block-b .bb-loading { color: var(--muted); padding: 12px 0; }
.block-b .bb-meta { font-size: 12px; }
.block-b .bb-meta pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; padding: 10px; background: var(--sunken); font: 12px var(--mono); }
@media (max-width: 1000px) { .block-b .bb-pair { grid-template-columns: 1fr; } }
@media (max-width: 480px) {
  .block-b .bb-body { padding: 12px; }
  .block-b .bb-chart text { font-size: 14px; }
  .block-b .bb-track { width: 44px; }
}
@media print {
  .block-b .bb-table { max-height: none; overflow: visible; }
  .block-b .bb-pair { grid-template-columns: 1fr; }
  .block-b .bb-section { break-inside: avoid; }
}
